# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/subworkflows/yaml-schema.json
name: "pipeline_initialisation"
description: Subworkflow with utility functions specific to the nf-core/daamicrobiome pipeline
keywords:
  - utility
  - pipeline
  - initialisation
  - completion
components:
  - utils_nfschema_plugin
  - completionemail
  - completionsummary
  - utils_nfcore_pipeline
  - utils_nextflow_pipeline
input:
  - version:
      type: boolean
      description: Display version and exit
  - validate_params:
      type: boolean
      description: Whether to validate parameters against the schema at runtime
  - monochrome_logs:
      type: boolean
      description: Do not use coloured log outputs
  - nextflow_cli_args:
      type: list
      description: List of positional Nextflow CLI args
  - outdir:
      type: string
      description: The output directory where results will be saved
  - input:
      type: string
      description: Path to input file
  - help:
      type: boolean
      description: Display help message and exit
  - help_full:
      type: boolean
      description: Show the full help message
  - show_hidden:
      type: boolean
      description: Show hidden parameters in the help message
output:
  - samplesheet:
      type: channel
      description: |
        Parsed samplesheet channel
        Structure: [ val(meta), path(reads) ]
  - versions:
      type: channel
      description: |
        Software versions channel
        Structure: [ path(versions.yml) ]
authors:
  - "@mcardina"
maintainers:
  - "@mcardina"
